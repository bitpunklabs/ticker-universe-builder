# Tooling configuration only. This skill is not a pip package: it is a directory an agent reads,
# and it must keep running from a plain checkout with nothing installed.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
