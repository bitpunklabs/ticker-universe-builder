name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The skill claims to run on a plain checkout with no dependencies, so the job installs
    # nothing before running the suite. If that claim ever stops being true, this fails.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest tests -q

  build-the-examples:
    # The suite already rebuilds every example in-process. This runs them the way a user does,
    # through the CLI, so a broken entry point cannot pass while the library still works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the committed examples match their seeds
        # The suite asserts this too; here it fails as a diff, which says what changed.
        run: |
          python examples/build_examples.py
          git diff --exit-code examples/
      - name: build each market
        # Every market with an example, read off the examples directory rather than listed here.
        # Artifact names carry the market and the date, so the path comes back from the command
        # rather than being guessed at here.
        run: |
          markets=$(ls -d examples/*-light | sed 's|examples/||; s|-light||' | tr '\n' ' ')
          echo "building: $markets"
          for market in $markets; do
            python scripts/universe.py build \
              --spec "examples/$market-light/build-spec.json" \
              --snapshot "examples/$market-light/snapshot.json" \
              --output "/tmp/$market" > "/tmp/$market.result.json"
            universe=$(python -c \
              "import json,sys; print(json.load(open(sys.argv[1]))['artifacts']['universe'])" \
              "/tmp/$market.result.json")
            python scripts/universe.py validate "$universe" > /dev/null
            echo "$universe" > "/tmp/$market.path"
          done
      - name: read a watchlist back in and reach the same tickers
        run: |
          watchlist=$(python -c \
            "import json,sys; print(json.load(open(sys.argv[1]))['artifacts']['watchlist'])" \
            /tmp/crypto.result.json)
          python scripts/universe.py import --watchlist "$watchlist" --market crypto \
            --output /tmp/crypto.draft.json
          python scripts/universe.py taxonomy --market crypto --profile light > /dev/null
      - name: check every starter theme table
        # Every registered market, at every depth, read off the registry rather than listed here
        # -- a market added without a table that checks clean fails the job on the same commit.
        run: |
          markets=$(python -c \
            "import sys; sys.path.insert(0, 'scripts'); import universe_core; \
             print(' '.join(sorted(universe_core.MARKETS)))")
          echo "checking: $markets"
          for market in $markets; do
            python scripts/universe.py taxonomy --market "$market" --output "/tmp/$market.tax.json"
            for profile in light medium heavy; do
              python scripts/universe.py taxonomy --check "/tmp/$market.tax.json" \
                --market "$market" --profile "$profile" > /dev/null
            done
          done
      - name: the report follows the market's language
        run: |
          grep -q '^# CN 标的池' "$(dirname "$(cat /tmp/cn.path)")"/cn-light-*.md
          grep -q '^# US Ticker Universe' "$(dirname "$(cat /tmp/us.path)")"/us-light-*.md
          grep -q '^# JP 銘柄ユニバース' "$(dirname "$(cat /tmp/jp.path)")"/jp-light-*.md
          grep -q '^# KR 종목 유니버스' "$(dirname "$(cat /tmp/kr.path)")"/kr-light-*.md
          grep -q '^# Universo de tickers BR' "$(dirname "$(cat /tmp/br.path)")"/br-light-*.md
          python scripts/universe.py build --language en \
            --spec examples/cn-light/build-spec.json \
            --snapshot examples/cn-light/snapshot.json --output /tmp/cn-en > /dev/null
          grep -q '^# CN Ticker Universe' /tmp/cn-en/cn-light-*.md
      - name: apply the example change set
        run: |
          python scripts/universe.py maintain \
            --universe "$(cat /tmp/crypto.path)" \
            --changes examples/crypto-light/changes.json \
            --output /tmp/crypto-v2

      - name: diff the reviewed universe against the one it came from
        run: |
          reviewed=$(ls /tmp/crypto-v2/crypto-light-*.json | grep -v validation)
          python scripts/universe.py diff "$(cat /tmp/crypto.path)" "$reviewed" \
            > /tmp/crypto.diff.json
          python - <<'EOF'
          import json
          diff = json.load(open("/tmp/crypto.diff.json"))
          assert diff["added"] == ["BINANCE:TRXUSDT.P"], diff["added"]
          assert diff["removed"] == ["BINANCE:GMXUSDT.P"], diff["removed"]
          assert diff["market_spec"] == "unchanged"
          EOF

      - name: evaluate the built universe against a synthetic window
        # Deterministic straight-line prices: the point is that every section computes and the
        # coverage pool is wider than the universe, not that the numbers mean anything.
        run: |
          python - <<'EOF'
          import json
          universe = json.load(open(open("/tmp/crypto.path").read().strip()))
          tickers = [m["ticker"] for m in universe["members"]]
          tickers += [a["ticker"] for a in universe["selection_audit"]]
          rows = ["date,ticker,close"]
          for index, ticker in enumerate(sorted(set(tickers))):
              for day in range(30):
                  close = 100.0 * (1.0 + (index % 11 - 5) / 100 * day / 29)
                  rows.append(f"2026-10-{day + 1:02d},{ticker},{close:.4f}")
          open("/tmp/window.csv", "w").write("\n".join(rows) + "\n")
          EOF
          python scripts/universe.py evaluate \
            --universe "$(cat /tmp/crypto.path)" --prices /tmp/window.csv \
            --benchmark BINANCE:BTCUSDT.P --output /tmp/evaluation.json
          python - <<'EOF'
          import json
          report = json.load(open("/tmp/evaluation.json"))
          assert report["survival"]["rate"] == 1.0, report["survival"]
          assert report["coverage"]["member_share_of_pool"] < 1.0, report["coverage"]
          assert report["independence"]["compared"] > 0, report["independence"]
          # Every pair is computed, and the members this window cannot rank are named rather
          # than quietly missing from the count.
          red = report["redundancy"]
          assert red["pairs"] == red["compared"] * (red["compared"] - 1) // 2, red
          assert red["compared"] + len(red["no_variation"]) + len(red["short_history"]) \
              == report["survival"]["observed"], red
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
